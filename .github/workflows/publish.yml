name: Publish Images

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Scan & Publish
    if: >
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["dev", "main"]'), github.event.workflow_run.head_branch)
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: toeicmaster-api
            context: .
            dockerfile: Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Tags
        id: tags
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          SHA="$SOURCE_SHA"
          BRANCH="$SOURCE_BRANCH"
          CUSTOM_TAG=""
          SHORT_SHA="$SHA"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${OWNER}/${{ matrix.image }}"

          if [ -n "${CUSTOM_TAG}" ]; then
            FLOATING_TAG="${CUSTOM_TAG}"
          else
            FLOATING_TAG="${BRANCH}"
          fi

          SCAN_TAG="ghcr.io/${IMAGE_NAME}:scan-${SHORT_SHA}"
          PUSH_TAGS="ghcr.io/${IMAGE_NAME}:${FLOATING_TAG},ghcr.io/${IMAGE_NAME}:sha-${SHORT_SHA}"
          if [ "${BRANCH}" = "main" ]; then
            PUSH_TAGS="${PUSH_TAGS},ghcr.io/${IMAGE_NAME}:latest"
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "scan_tag=${SCAN_TAG}" >> "$GITHUB_OUTPUT"
          echo "push_tags=${PUSH_TAGS}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image for vulnerability scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.tags.outputs.scan_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.tags.outputs.scan_tag }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-toeicmaster-api
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Push image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.push_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
