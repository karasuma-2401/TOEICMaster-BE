name: User story
description: User-facing work that delivers value and can be completed within a sprint.
title: "[Story] "
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: "As a [user], I want [capability], so that [value]."
    validations: { required: true }
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: "Verifiable conditions, including error states where applicable."
      placeholder: "- [ ] Given … When … Then …"
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and references
      description: "Link to Issue/PR in the other repository, API contract, or design."
  - type: input
    id: estimate
    attributes:
      label: Story points
      description: "Estimated by the team during refinement/planning; can be left blank beforehand."
