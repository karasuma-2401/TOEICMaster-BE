name: Bug report
description: A reproducible bug.
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior and evidence }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Environment and commit }
